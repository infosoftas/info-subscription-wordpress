name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.4']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: wordpress-test-only
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, mysqli, openssl
          tools: composer:v2, wp-cli
          coverage: none
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(awk '/^[[:space:]]*\* Version:/ {print $3}' infosub.php)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match plugin version v$version"
            exit 1
          fi
      - name: Validate and build
        run: |
          composer validate --no-check-publish
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          composer build
      - name: Run standalone tests
        run: |
          php tests/gate-multiple-products.php
          php tests/meta-box-multiple-products.php
      - name: Install isolated WordPress
        env:
          WP_PATH: ${{ runner.temp }}/wordpress
        run: |
          wp core download --path="$WP_PATH"
          wp config create --path="$WP_PATH" --dbname=wordpress --dbuser=root \
            --dbpass=wordpress-test-only --dbhost=127.0.0.1:3306
          wp core install --path="$WP_PATH" --url=https://wordpress.test \
            --title="Plugin tests" --admin_user=plugin-tests \
            --admin_password="$(openssl rand -hex 24)" --admin_email=tests@example.test \
            --skip-email
          wp plugin install "$GITHUB_WORKSPACE/dist/infosub.zip" --activate --path="$WP_PATH"
      - name: Run WordPress integration tests
        env:
          WP_PATH: ${{ runner.temp }}/wordpress
        run: |
          wp eval-file "$GITHUB_WORKSPACE/tests/api-error-details.php" --path="$WP_PATH"
          wp eval-file "$GITHUB_WORKSPACE/tests/oidc-id-token-flow.php" --path="$WP_PATH"
      - name: Upload installable plugin
        if: matrix.php == '8.4'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: infosub
          path: dist/infosub.zip
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: infosub
          path: dist
      - name: Create draft with installable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/infosub.zip \
            --verify-tag --draft --generate-notes --title "$TAG"
